name: HyperbolicDeltaNet CPU reference validation

on:
  push:
    branches: [add-hyperbolic-delta-net]
    paths:
      - 'fla/ops/hyperbolic_delta_rule/**'
      - 'fla/layers/hyperbolic_deltanet.py'
      - 'fla/models/hyperbolic_deltanet/**'
      - 'tests/ops/test_hyperbolic_delta_rule_reference.py'
      - 'tests/layers/test_hyperbolic_deltanet.py'
      - '.github/workflows/hyperbolic-cpu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
      - name: Compile changed Python sources
        run: |
          python -m compileall -q fla/ops/hyperbolic_delta_rule fla/layers/hyperbolic_deltanet.py fla/models/hyperbolic_deltanet tests/ops/test_hyperbolic_delta_rule_reference.py
      - name: Run independent CPU reference tests
        run: |
          python -m pytest --noconftest -q tests/ops/test_hyperbolic_delta_rule_reference.py
